<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contrôle Alpha</title>
</head>
<body>

<h2>Contrôle Alpha</h2>

<form id="form">

  <label>Host</label><br>
  <input type="text" id="host" value="127.0.0.1" required><br><br>

  <label>Port</label><br>
  <input type="number" id="port" value="223" required><br><br>

  <label>Mode</label><br>
  <select id="mode">
    <option value="slot">Machine à sous</option>
    <option value="scroll">Défilement</option>
  </select><br><br>

  <div id="scrollBox" style="display:none">
    <label>Message fixe</label><br>
    <input type="text" id="message" placeholder="Ex : oui"><br><br>

    <label>Direction</label><br>
    <select id="direction">
      <option value="gauche">Gauche</option>
      <option value="droite">Droite</option>
      <option value="haut">Haut</option>
      <option value="bas">Bas</option>
    </select><br><br>
  </div>

  <button type="submit">Envoyer</button>

</form>

<script>
const mode = document.getElementById("mode");
const scrollBox = document.getElementById("scrollBox");

mode.addEventListener("change", () => {
  scrollBox.style.display = mode.value === "scroll" ? "block" : "none";
});

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  // Ici, on met l'URL complète de ton serveur Flask
  const flaskUrl = "http://127.0.0.1:5001/api/config";

  const data = {
    host: document.getElementById("host").value,
    port: document.getElementById("port").value,
    mode: mode.value,
    message: document.getElementById("message")?.value,
    direction: document.getElementById("direction")?.value
  };

  try {
    const response = await fetch(flaskUrl, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });

    if (response.ok) {
      alert("Commande envoyée !");
    } else {
      alert("Erreur serveur : " + response.status);
    }
  } catch (err) {
    alert("Impossible de contacter le serveur Flask : " + err);
  }
});
</script>

</body>
</html>
