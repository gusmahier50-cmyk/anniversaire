<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contrôle Alpha</title>
  <style>
        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: pink;
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #bb1450 0%, #8b0000 100%);
            color: white;
            padding: 30px;
            margin: -20px -20px 30px -20px;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Contrôle Alpha (GitHub Pages)</h2>

<form id="form">

  <label>Host</label><br>
  <input type="text" id="host" value="127.0.0.1"><br><br>

  <label>Port</label><br>
  <input type="number" id="port" value="222"><br><br>

  <label>Mode</label><br>
  <select id="mode">
    <option value="slot">Machine à sous</option>
    <option value="scroll">Défilement</option>
  </select><br><br>

  <div id="scrollBox" style="display:none">
    <label>Message fixe</label><br>
    <input type="text" id="message"><br><br>

    <label>Direction</label><br>
    <select id="direction">
      <option value="gauche">Gauche</option>
      <option value="droite">Droite</option>
      <option value="haut">Haut</option>
      <option value="bas">Bas</option>
    </select><br><br>
  </div>

  <button type="submit">Envoyer</button>
</form>

<script>
const mode = document.getElementById("mode");
const scrollBox = document.getElementById("scrollBox");

mode.addEventListener("change", () => {
  scrollBox.style.display = mode.value === "scroll" ? "block" : "none";
});

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  alert("GitHub Pages ne peut pas contacter le serveur Flask 😅");
});
</script>

</body>
</html>
